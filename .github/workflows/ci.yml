# Build and test PSim Studio on Linux, Windows and macOS, then build the distributable packages.
#
# Linux runs the whole suite under Xvfb with Mesa (software OpenGL 3.3), with the native core and with the
# NumPy fallback. Windows and macOS runners have no usable OpenGL 3.3 display, so the suite runs with Qt's
# offscreen platform there: the tests that need OpenGL skip themselves (tests/conftest.py, requires_gl).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}${{ matrix.fallback && ', NumPy fallback' || '' }}${{ matrix.scale == 2 && ', 2x scale' || '' }}${{ matrix.gl && ', OpenGL' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PSIM_HANG_DUMP: ${{ github.workspace }}/hang.txt     # stacks of a test that runs > 5 min (tests/conftest.py)
      PSIM_TEST_TIMEOUT: "300"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        fallback: [false]
        scale: [1]                  # an axis, so the 2x entry below adds a job instead of changing the Linux one
        gl: [false]                 # Windows/macOS: true runs the OpenGL tests (software rendering) as well
        include:
          - os: ubuntu-latest
            fallback: true
          # high-DPI rendering and picking (as on Retina / 200 % Windows displays), with real OpenGL under Xvfb
          - os: ubuntu-latest
            fallback: false
            scale: 2
          # the rendering, picking and viewport tests on Windows (Mesa llvmpipe as opengl32.dll) and on macOS
          # (the runner's desktop session with Apple's software OpenGL 4.1 core renderer)
          - os: windows-latest
            fallback: false
            gl: true
          - os: macos-latest
            fallback: false
            gl: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Linux packages (Xvfb, Mesa, Qt platform libraries)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libfontconfig1 libdbus-1-3
      - name: Python packages
        run: python -m pip install -r requirements.txt
      - name: Build and test the native C++ core
        run: python build_native.py
      - name: Tests (Linux, Xvfb)
        if: runner.os == 'Linux'
        env:
          PSIM_FORCE_PYTHON_NUMERICS: ${{ matrix.fallback && '1' || '' }}
          QT_SCALE_FACTOR: ${{ matrix.scale || '1' }}
          PSIM_REQUIRE_GL: "1"
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" python .github/scripts/gl_info.py
          xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q -rfs tests -p no:cacheprovider --junitxml=report.xml
      - name: Mesa software OpenGL (Windows)
        if: runner.os == 'Windows' && matrix.gl
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # llvmpipe from the mesa-dist-win release, placed next to python.exe: Qt and PyOpenGL then both load
          # this opengl32.dll instead of the runner's OpenGL 1.1 GDI implementation
          $rel = gh api repos/pal1000/mesa-dist-win/releases/latest | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -match '^mesa3d-.*-release-msvc\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "No MSVC release archive in mesa-dist-win $($rel.tag_name)" }
          Write-Host "::notice title=Mesa::mesa-dist-win $($rel.tag_name) ($($asset.name))"
          Invoke-WebRequest $asset.browser_download_url -OutFile mesa.7z
          7z x mesa.7z -omesa "x64\*.dll" | Out-Null
          $py = python -c "import os, sys; print(os.path.dirname(sys.executable))"
          Copy-Item mesa\x64\*.dll $py
          "GALLIUM_DRIVER=llvmpipe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # Qt would otherwise fall back to its own bundled opengl32sw.dll (an old Mesa) while PyOpenGL loads this one
          "QT_OPENGL=desktop" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Tests (OpenGL)
        if: runner.os != 'Linux' && matrix.gl
        env:
          PSIM_REQUIRE_GL: "1"
          # the macOS App Nap activity is off by default until verified; it is exercised here
          PSIM_MACOS_ACTIVITY: ${{ runner.os == 'macOS' && '1' || '' }}
        run: |
          python .github/scripts/gl_info.py
          python -m pytest -q -rfs tests -p no:cacheprovider --junitxml=report.xml
      - name: Tests (offscreen)
        if: runner.os != 'Linux' && !matrix.gl
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rf tests -p no:cacheprovider --junitxml=report.xml
      - name: Annotate failing tests
        if: failure()
        run: python .github/scripts/annotate_failures.py report.xml "${{ runner.os }}" hang.txt

  package:
    name: package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Linux packages (Qt platform libraries, dpkg-deb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3
      - name: Python packages
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Inno Setup on PATH (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (Test-Path "$iscc\ISCC.exe") { Add-Content $env:GITHUB_PATH $iscc }
          else { Write-Warning "Inno Setup not found: only the .zip archive will be built" }
      - name: Build the packages (native core, freeze, smoke test, archives)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/build_dist.py
      - uses: actions/upload-artifact@v5
        with:
          name: psim-studio-${{ runner.os }}
          path: |
            packaging/dist/*.zip
            packaging/dist/*.tar.gz
            packaging/dist/*.deb
            packaging/dist/*.exe
          if-no-files-found: error
