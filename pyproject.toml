[project]
name = "psim-studio"
version = "0.1.0"
description = "Professional 3D physics simulation studio (Phase 1: scene building and 3D viewport)"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "PyOpenGL>=3.1.7", "numpy>=1.26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Function.*QDrag(Enter|Move)Event.*deprecated:DeprecationWarning",
]
